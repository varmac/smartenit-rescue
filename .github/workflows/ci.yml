name: ci

on:
  push:
    branches:
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --extra dev
      - run: uv run python scripts/check_public_tree.py .
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest --cov=smartenit_rescue --cov-report=term-missing
      - run: uv run python -m build
      - name: Smoke installed wheel public entrypoint and resources
        run: |
          set -euo pipefail
          WHEEL=(dist/*.whl)
          if [ ! -e "${WHEEL[0]}" ]; then
            echo "No wheel found in dist/" >&2
            exit 1
          fi
          uv venv --seed --python .venv/bin/python .smoke-env
          env -u PYTHONPATH uv pip install --python .smoke-env/bin/python --no-cache "${WHEEL[0]}"
          PROFILE_LIST="$(mktemp)"
          env -u PYTHONPATH .smoke-env/bin/smartenit-rescue profiles list | tee "$PROFILE_LIST"
          grep -q '^smartenit\.4040c\t' "$PROFILE_LIST"
          env -u PYTHONPATH .smoke-env/bin/python -c "import smartenit_rescue.profiles; tuple(smartenit_rescue.profiles.iter_builtin_profiles())"
          rm -f "$PROFILE_LIST"
          rm -rf .smoke-env
      - run: uv run pip-audit
      - name: Verify clean exported source and release artifacts
        shell: bash
        run: |
          set -euo pipefail
          RESCUE_EXPORT_DIR="$(mktemp -d)"
          trap 'rm -rf "$RESCUE_EXPORT_DIR"' EXIT
          git archive --format=tar HEAD | tar -xf - -C "$RESCUE_EXPORT_DIR"
          cd "$RESCUE_EXPORT_DIR"
          env -u PYTHONPATH uv sync --extra dev
          env -u PYTHONPATH uv run pytest -q
          env -u PYTHONPATH uv run ruff check .
          env -u PYTHONPATH uv run ruff format --check .
          env -u PYTHONPATH uv run mypy src tests scripts
          env -u PYTHONPATH uv run python scripts/check_public_tree.py .
          env -u PYTHONPATH uv build
          env -u PYTHONPATH uv run python scripts/verify_release_tree.py \
            dist/*.whl dist/*.tar.gz
          if env -u PYTHONPATH uv tree | grep -E \
            '(^|[[:space:]])(file:|git\+ssh:|-e[[:space:]]|--editable[[:space:]])'
          then
            echo "local or private dependency detected" >&2
            exit 1
          fi
